name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-tarpaulin --locked
      - run: cargo tarpaulin --features json --out xml
      - uses: codecov/codecov-action@v5
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Bake launcher
        run: cargo install socketry-cargo-bake --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets --workspace --locked -- -D warnings
      - name: Run workspace tests
        run: cargo bake --locked test
      - name: Test all features
        run: cargo test --all-features --workspace --locked
